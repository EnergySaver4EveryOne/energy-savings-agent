[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-savings-agent"
version = "0.1.0"
description = "AI-Powered Energy Offer Comparison and Savings Agent for Australian (NSW) Residential Households"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Energy Savings Agent Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.4",
    "streamlit>=1.36.0",
    "google-genai>=2.30.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
energy-agent = "energy_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
